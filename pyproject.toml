[tool.poetry]
name = "casper-client"
version = "0.1.0"
description = "Client library for the Casper Vector Database"
authors = ["Alexander Ryzhikov <makseljoinb@gmail.com>"]
packages = [{ include = "casper_client" }]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/AlexRyzhickov/Casper"
repository = "https://github.com/casper-vdb/python-client"
keywords = ["vector", "search", "neural", "matching", "client"]

[tool.poetry.dependencies]
python = ">=3.10"
httpx = ">=0.24.0"
grpcio = ">=1.41.0"
protobuf = ">=3.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.1"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core>=1.0.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"


